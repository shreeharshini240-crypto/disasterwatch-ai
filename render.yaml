services:
  - type: web
    name: disasterwatch-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm run build --workspace @disasterwatch/api
    startCommand: npm run start --workspace @disasterwatch/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: disasterwatch-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@disasterwatch.ai
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: disasterwatch-db
    databaseName: disasterwatch
    user: disasterwatch
